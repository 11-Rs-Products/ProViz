  <script>
    // Resolve the theme before first paint so there is never a flash of the wrong palette.
    (function () {
      var t = null;
      try { t = localStorage.getItem('proviz.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
