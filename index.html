<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Equation Solver Visualization</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="login-overlay" style="position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white;">
      <h1 style="margin-bottom: 0.5rem; font-size: 2.5rem;">Py3D Visualizer</h1>
      <p style="margin-bottom: 2rem; color: #94a3b8;">IITM BS Students Only</p>
      <button id="btn-login" style="background: #2563eb; color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
        Sign in with Google
      </button>
      <p id="login-error" style="color: #ef4444; margin-top: 1rem; max-width: 400px; text-align: center; font-size: 0.9rem;"></p>
    </div>

    <div id="layout-container" style="display: none;">
      <div id="canvas-container">
        <canvas id="app-canvas"></canvas>
      </div>

      <div id="ui-sidebar">
        <div class="header">
          <h1>Py3D Visualizer</h1>
          
          <div class="problem-selector" style="display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center;">
            <label for="question-select" style="font-weight: 600;">Question:</label>
            <select id="question-select" style="flex: 1; padding: 0.5rem; border-radius: 6px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white;">
              <!-- Options populated dynamically -->
            </select>
          </div>
          <div id="error-msg" class="error-text"></div>
        </div>

        <div class="controls-panel" style="flex: 1; display: flex; flex-direction: column;">
          <div class="step-info">
            <h2 id="question-title">Question Title</h2>
            <p id="question-desc" style="white-space: pre-wrap;">Question description...</p>
          </div>
          
          <div class="code-container" style="flex: 1; display: flex; flex-direction: column; min-height: 250px;">
            <div class="code-header">
              <span>Python Editor</span>
            </div>
            <div id="editor-container" style="flex: 1; background: #1e1e1e; overflow: hidden; border-radius: 0 0 8px 8px;">
              <!-- CodeMirror injected here -->
            </div>
          </div>
          
          <div class="buttons" style="margin-top: 1rem;">
            <button id="btn-run" class="primary" style="flex: 1;">Run Code</button>
            <button id="btn-reset" class="reset">Reset Scene</button>
          </div>
        </div>
      </div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
